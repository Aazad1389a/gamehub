<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دنیای بازی‌ها | GameHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <h1>دنیای بازی‌ها</h1>
    <p>جدیدترین بازی‌های روز دنیا را پیدا کن</p>
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="searchGame()" placeholder="نام بازی را جستجو کنید...">
    </div>
  </header>

  <main class="container">
    <h2>جدیدترین بازی‌ها 🔥</h2>
    
    <div class="games-grid" id="gamesGrid">
      
      <!-- کارت بازی ۱ -->
      <div class="card" data-title="assassin's creed اساسین کرید">
        <div class="icon">⚔️</div>
        <h3>Assassin's Creed</h3>
        <span class="platform">PC • Console</span>
        <a href="game-details.html?game=ac" class="btn">مشاهده بازی</a>
      </div>

      <!-- کارت بازی ۲ -->
      <div class="card" data-title="grand theft auto vi gta 6 جی تی ای">
        <div class="icon">🏎️</div>
        <h3>Grand Theft Auto VI</h3>
        <span class="platform">PC • Console</span>
        <a href="game-details.html?game=gta6" class="btn">مشاهده بازی</a>
      </div>

      <!-- کارت بازی ۳ -->
      <div class="card" data-title="blood strike بلاد استرایک">
        <div class="icon">🎯</div>
        <h3>Blood Strike</h3>
        <span class="platform">PC • Android</span>
        <a href="game-details.html?game=bloodstrike" class="btn">مشاهده بازی</a>
      </div>

    </div>
  </main>

  <script>
    function searchGame() {
      let input = document.getElementById('searchInput').value.toLowerCase();
      let cards = document.getElementsByClassName('card');
      
      for (let i = 0; i < cards.length; i++) {
        let title = cards[i].getAttribute('data-title');
        if (title.includes(input)) {
          cards[i].style.display = "flex";
        } else {
          cards[i].style.display = "none";
        }
      }
    }
  </script>
</body>
</html>
