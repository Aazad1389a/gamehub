<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دانلود بازی | GameHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container details-page">
    <a href="index.html" class="back-btn">← بازگشت به صفحه اصلی</a>
    
    <div class="details-card">
      <div class="banner-wrapper">
        <img id="gameImg" src="" alt="Game Banner" class="detail-banner">
      </div>
      <h1 id="gameTitle">در حال بارگذاری...</h1>
      <p id="gamePlatform" class="platform"></p>
      <p id="gameDesc" class="desc"></p>

      <div class="action-buttons">
        <a id="irDownloadLink" href="#" target="_blank" class="btn ir-btn">دانلود مستقیم از سایت ایرانی 📥</a>
        <a id="steamLink" href="#" target="_blank" class="btn steam-btn">مشاهده در استیم (Steam) 🎮</a>
        <a id="directSteam" href="#" class="btn direct-btn">نصب مستقیم در نرم‌افزار استیم 🚀</a>
        <a id="googleImagesLink" href="#" target="_blank" class="btn google-img-btn">جستجوی تصاویر بیشتر در گوگل 🖼️</a>
      </div>
    </div>
  </main>

  <script src="games.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('id');

    const game = gamesDatabase.find(g => g.id === gameId);

    if (game) {
      document.getElementById('gameTitle').innerText = game.title;
      document.getElementById('gamePlatform').innerText = game.platform;
      document.getElementById('gameImg').src = game.img;
      document.getElementById('gameDesc').innerText = game.desc;
      
      // دانلود از سایت ایرانی
      const irBtn = document.getElementById('irDownloadLink');
      if (game.irDownloadLink) {
        irBtn.href = game.irDownloadLink;
        irBtn.innerText = `دانلود مستقیم (${game.irSiteName || 'سایت ایرانی'}) 📥`;
      } else {
        irBtn.style.display = 'none';
      }

      // لینک استیم و گوگل
      document.getElementById('steamLink').href = `https://store.steampowered.com/app/${game.steamId}/`;
      document.getElementById('directSteam').href = `steam://store/${game.steamId}`;
      document.getElementById('googleImagesLink').href = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(game.title + ' wallpaper PC')}`;
    } else {
      document.getElementById('gameTitle').innerText = "بازی یافت نشد!";
    }
  </script>
</body>
</html>
